apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: emqx
  namespace: deltalist
  labels:
    app: emqx
    poc: poc-b
spec:
  serviceName: emqx-headless
  replicas: 3
  selector:
    matchLabels:
      app: emqx
  template:
    metadata:
      labels:
        app: emqx
        poc: poc-b
    spec:
      containers:
      - name: emqx
        image: emqx/emqx:5.3.2
        ports:
        - name: mqtt
          containerPort: 1883
        - name: mqtts
          containerPort: 8883
        - name: ws
          containerPort: 8083
        - name: wss
          containerPort: 8084
        - name: dashboard
          containerPort: 18083
        - name: cluster
          containerPort: 4370
        env:
        - name: EMQX_NAME
          value: "emqx"
        - name: EMQX_CLUSTER__DISCOVERY_STRATEGY
          value: "dns"
        - name: EMQX_CLUSTER__DNS__NAME
          value: "emqx-headless.deltalist.svc.cluster.local"
        - name: EMQX_CLUSTER__DNS__RECORD_TYPE
          value: "srv"
        - name: EMQX_NODE__COOKIE
          valueFrom:
            secretKeyRef:
              name: emqx-secret
              key: node-cookie
        - name: EMQX_DASHBOARD__DEFAULT_USERNAME
          value: "admin"
        - name: EMQX_DASHBOARD__DEFAULT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: emqx-secret
              key: dashboard-password
        - name: EMQX_LISTENERS__TCP__DEFAULT__MAX_CONNECTIONS
          value: "100000"
        - name: EMQX_LISTENERS__TCP__DEFAULT__ACCEPTORS
          value: "64"
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 4000m
            memory: 8Gi
        volumeMounts:
        - name: emqx-data
          mountPath: /opt/emqx/data
        livenessProbe:
          httpGet:
            path: /status
            port: 18083
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /status
            port: 18083
          initialDelaySeconds: 30
          periodSeconds: 10
  volumeClaimTemplates:
  - metadata:
      name: emqx-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: managed-premium
      resources:
        requests:
          storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: emqx
  namespace: deltalist
  labels:
    app: emqx
spec:
  type: LoadBalancer
  selector:
    app: emqx
  ports:
  - name: mqtt
    port: 1883
    targetPort: 1883
    protocol: TCP
  - name: mqtts
    port: 8883
    targetPort: 8883
    protocol: TCP
  - name: ws
    port: 8083
    targetPort: 8083
    protocol: TCP
  - name: dashboard
    port: 18083
    targetPort: 18083
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: emqx-headless
  namespace: deltalist
  labels:
    app: emqx
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: emqx
  ports:
  - name: mqtt
    port: 1883
    targetPort: 1883
  - name: cluster
    port: 4370
    targetPort: 4370
---
apiVersion: v1
kind: Secret
metadata:
  name: emqx-secret
  namespace: deltalist
type: Opaque
stringData:
  node-cookie: "emqx_distributed_cookie_change_in_production"
  dashboard-password: "admin_password_change_in_production"
