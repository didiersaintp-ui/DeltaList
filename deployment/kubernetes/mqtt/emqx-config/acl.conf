%% EMQX Access Control List (ACL) Configuration
%% DeltaList MQTT Backend - Production-Ready ACL Rules
%%
%% This file defines topic-level access control for MQTT clients
%% Format: {allow|deny, {user|client|all}, Action, Topics}
%% Actions: publish | subscribe | pubsub

%% ===========================================================================
%% Backend Service ACL (DeltaListBackend client)
%% ===========================================================================
%% Backend can publish and subscribe to all topics for monitoring and admin
{allow, {user, "backend"}, pubsub, ["#"]}.
{allow, {client, "DeltaListBackend"}, pubsub, ["#"]}.

%% ===========================================================================
%% Device ACL Rules (Pattern-based for 30k devices)
%% ===========================================================================
%% Devices can PUBLISH events to their own topic only
%% Pattern: devices/{deviceId}/events
{allow, {user, "device-%u"}, publish, ["devices/%u/events"]}.

%% Devices can SUBSCRIBE to their own command topic
%% Pattern: devices/{deviceId}/commands
{allow, {user, "device-%u"}, subscribe, ["devices/%u/commands"]}.

%% Devices can SUBSCRIBE to global blacklist delta updates
%% All devices need to receive blacklist updates
{allow, {user, "device-%u"}, subscribe, ["blacklist/delta"]}.
{allow, all, subscribe, ["blacklist/delta"]}.

%% ===========================================================================
%% Admin/Monitoring ACL
%% ===========================================================================
%% Admin users can access system topics
{allow, {user, "admin"}, pubsub, ["$SYS/#"]}.

%% ===========================================================================
%% Default Deny-All Rule (Security)
%% ===========================================================================
%% Any topic access not explicitly allowed above is DENIED
%% This is a critical security measure
{deny, all}.

%% ===========================================================================
%% Notes for Production:
%% ===========================================================================
%% 1. Device usernames must follow pattern: "device-{deviceId}"
%%    Example: "device-TPE-001", "device-TPE-002", etc.
%%
%% 2. The %u placeholder is replaced with the authenticated username
%%    This enables pattern-based ACL for 30k devices without individual rules
%%
%% 3. Blacklist delta topic uses retained messages (QoS 1)
%%    Ensures offline devices receive last update on reconnect
%%
%% 4. For sharded deployments, use shard-specific topics:
%%    blacklist/delta/shard-{shardId}
%%
%% 5. To reload ACL without restart:
%%    docker exec emqx emqx_ctl acl reload
%%
%% 6. Monitor ACL denials in logs:
%%    docker logs emqx | grep "ACL deny"
