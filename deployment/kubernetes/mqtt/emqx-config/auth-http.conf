## EMQX HTTP Authentication Plugin Configuration
## DeltaList MQTT Backend - Webhook-based Authentication
##
## This configuration enables EMQX to authenticate devices via HTTP webhooks
## to the MqttBackend authentication service

##--------------------------------------------------------------------
## HTTP Authentication/ACL Plugin Settings
##--------------------------------------------------------------------

## Authentication request URL
## EMQX will POST to this endpoint for each connection attempt
auth.http.auth_req = http://mqttbackend:5000/api/auth/mqtt
auth.http.auth_req.method = post
auth.http.auth_req.content_type = json

## Authentication request parameters
## These will be sent in JSON body to the auth endpoint
auth.http.auth_req.params = clientid=%c,username=%u,password=%P,peerhost=%a,protocol=%r

## HTTP request timeout
auth.http.request.timeout = 5s

## Retry configuration
auth.http.request.retry_times = 3
auth.http.request.retry_interval = 1s
auth.http.request.retry_backoff = 2.0

## Connection pool
auth.http.request.pool_size = 32

## SSL/TLS options (if backend uses HTTPS)
## auth.http.ssl.cacertfile = /etc/emqx/certs/ca.crt
## auth.http.ssl.certfile = /etc/emqx/certs/client.crt
## auth.http.ssl.keyfile = /etc/emqx/certs/client.key
## auth.http.ssl.verify = verify_peer

##--------------------------------------------------------------------
## ACL (Authorization) request (optional - using acl.conf instead)
##--------------------------------------------------------------------
## Uncomment to enable HTTP-based ACL checks
## auth.http.acl_req = http://mqttbackend:5000/api/auth/acl
## auth.http.acl_req.method = post
## auth.http.acl_req.content_type = json
## auth.http.acl_req.params = access=%A,username=%u,clientid=%c,ipaddr=%a,topic=%t,mountpoint=%m

##--------------------------------------------------------------------
## Super user request (optional)
##--------------------------------------------------------------------
## auth.http.super_req = http://mqttbackend:5000/api/auth/superuser
## auth.http.super_req.method = post
## auth.http.super_req.content_type = json
## auth.http.super_req.params = clientid=%c,username=%u

##--------------------------------------------------------------------
## Response Handling
##--------------------------------------------------------------------
## Expected HTTP status codes:
## - 200: Authentication successful
## - 401: Authentication failed (invalid credentials)
## - 403: Forbidden (device revoked/inactive)
## - Other: Treat as authentication failure

## HTTP response body (JSON) should contain:
## {
##   "result": "allow" | "deny",
##   "is_superuser": false
## }

##--------------------------------------------------------------------
## Notes for Production:
##--------------------------------------------------------------------
## 1. The MqttBackend service must implement endpoint:
##    POST /api/auth/mqtt
##    Request body:
##    {
##      "clientid": "device-001",
##      "username": "device-001" or JWT token,
##      "password": "device-password",
##      "peerhost": "10.0.0.5",
##      "protocol": "mqtt"
##    }
##
##    Response (200 OK):
##    {
##      "result": "allow",
##      "is_superuser": false
##    }
##
## 2. For JWT authentication:
##    - Pass JWT token as username
##    - Leave password empty or use fixed value
##    - Backend validates JWT and returns allow/deny
##
## 3. Backend should cache device credentials in Redis
##    for fast authentication (< 5ms response time)
##
## 4. Monitor authentication metrics:
##    - Success rate (target: > 99.9%)
##    - Response time (target: < 10ms p99)
##    - Failures (alert if spike detected)
##
## 5. Enable this plugin in EMQX:
##    docker exec emqx emqx_ctl plugins load emqx_auth_http
##
## 6. Reload configuration:
##    docker exec emqx emqx_ctl plugins reload emqx_auth_http
