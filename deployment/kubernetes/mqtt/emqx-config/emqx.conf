## EMQX Main Configuration
## DeltaList MQTT Backend - Production Settings

##--------------------------------------------------------------------
## Cluster & Node Settings
##--------------------------------------------------------------------
node.name = emqx@127.0.0.1
node.cookie = deltalist_secret_cookie_change_in_production
node.data_dir = /opt/emqx/data

##--------------------------------------------------------------------
## Logging
##--------------------------------------------------------------------
log.level = warning
log.to = both
log.rotation = on
log.rotation.size = 100MB
log.rotation.count = 10

##--------------------------------------------------------------------
## MQTT Listeners
##--------------------------------------------------------------------
## MQTT TCP Listener (Port 1883)
listener.tcp.external = 0.0.0.0:1883
listener.tcp.external.acceptors = 64
listener.tcp.external.max_connections = 1024000
listener.tcp.external.max_conn_rate = 10000

## MQTT over WebSocket (Port 8083)
listener.ws.external = 0.0.0.0:8083
listener.ws.external.acceptors = 16
listener.ws.external.max_connections = 102400

## MQTT over SSL/TLS (Port 8883) - Recommended for production
listener.ssl.external = 0.0.0.0:8883
listener.ssl.external.acceptors = 32
listener.ssl.external.max_connections = 102400
## listener.ssl.external.cacertfile = /opt/emqx/etc/certs/ca.crt
## listener.ssl.external.certfile = /opt/emqx/etc/certs/server.crt
## listener.ssl.external.keyfile = /opt/emqx/etc/certs/server.key
## listener.ssl.external.verify = verify_peer
## listener.ssl.external.fail_if_no_peer_cert = true

##--------------------------------------------------------------------
## MQTT Protocol Settings
##--------------------------------------------------------------------
mqtt.max_packet_size = 1MB
mqtt.max_clientid_len = 256
mqtt.max_topic_levels = 128
mqtt.max_topic_alias = 65535
mqtt.max_qos_allowed = 2
mqtt.retain_available = true
mqtt.max_subscriptions = 100

## Session settings
mqtt.session.max_inflight = 32
mqtt.session.max_awaiting_rel = 100
mqtt.session.await_rel_timeout = 300s
mqtt.session.max_mqueue_len = 10000

## Keep-alive
zone.external.idle_timeout = 120s
zone.external.keepalive_backoff = 0.75

##--------------------------------------------------------------------
## Retained Messages
##--------------------------------------------------------------------
mqtt.retained.enable = true
mqtt.retained.max_payload_size = 1MB
mqtt.retained.max_retained_messages = 10000

##--------------------------------------------------------------------
## System Topics (for monitoring)
##--------------------------------------------------------------------
mqtt.sys_interval = 60s
mqtt.allow_anonymous = false

##--------------------------------------------------------------------
## ACL & Authentication
##--------------------------------------------------------------------
## Load ACL from file
acl_file = /opt/emqx/etc/acl.conf

## Authentication order
## 1. HTTP webhook (auth-http.conf)
## 2. Built-in database (fallback)
auth.order = http,mnesia

##--------------------------------------------------------------------
## Rate Limiting (per connection)
##--------------------------------------------------------------------
## Publish rate limit
zone.external.publish_limit = 100,10s

## Subscribe rate limit
zone.external.subscribe_limit = 100,10s

##--------------------------------------------------------------------
## Metrics & Monitoring
##--------------------------------------------------------------------
## Prometheus metrics endpoint
prometheus.push.gateway.server = http://prometheus:9091
prometheus.interval = 15s

## Dashboard (HTTP Management API)
dashboard.listener.http = 0.0.0.0:18083
dashboard.default_username = admin
dashboard.default_password = public_change_in_production

##--------------------------------------------------------------------
## Plugins
##--------------------------------------------------------------------
## Enable plugins
plugins.loaded_file = /opt/emqx/data/loaded_plugins

##--------------------------------------------------------------------
## Performance Tuning for 30k Devices
##--------------------------------------------------------------------
## Memory tuning
vm_args.-env ERL_MAX_PORTS = 1048576
vm_args.-env ERL_MAX_ETS_TABLES = 256000

## Process limits
vm_args.+P = 2097152
vm_args.+Q = 1048576

## Scheduler tuning
vm_args.+sbt = db
vm_args.+sbwt = very_long

## Memory allocator
vm_args.+MBas = aobf

##--------------------------------------------------------------------
## Notes for Production:
##--------------------------------------------------------------------
## 1. Change default passwords and cookie
## 2. Enable SSL/TLS on port 8883
## 3. Configure proper certificates
## 4. Tune max_connections based on device count
## 5. Monitor metrics via Prometheus
## 6. Enable cluster mode for high availability
## 7. Use persistent volumes for data directory
## 8. Configure log rotation and retention
## 9. Set up backup for EMQX cluster data
## 10. Monitor and alert on:
##     - Connection rate
##     - Message throughput
##     - Authentication failures
##     - Memory usage
##     - Queue lengths
