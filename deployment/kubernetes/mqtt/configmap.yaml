apiVersion: v1
kind: ConfigMap
metadata:
  name: mqtt-backend-config
  namespace: deltalist
  labels:
    app: mqtt-backend
    poc: poc-b
data:
  appsettings.Production.json: |
    {
      "Backend": {
        "Environment": "Production",
        "ServerPort": 8080,
        "ServerHost": "0.0.0.0",
        "MetricsPort": 9090,
        "HealthCheckInterval": 30,
        "GracefulShutdownTimeout": 30,
        "Security": {
          "EnableAuthentication": true,
          "EnableAuthorization": true,
          "TokenExpirationMinutes": 60,
          "RefreshTokenExpirationDays": 30
        },
        "Mqtt": {
          "ClientIdPrefix": "deltalist-backend",
          "CleanSession": false,
          "AutoReconnect": true,
          "KeepAlivePeriod": 60,
          "MaxReconnectDelay": 300,
          "ConnectTimeout": 30,
          "QoS": 1,
          "Retain": false,
          "Topics": {
            "Commands": "deltalist/commands/+",
            "Telemetry": "deltalist/telemetry/+",
            "Status": "deltalist/status/+",
            "Responses": "deltalist/responses/+"
          },
          "MaxPendingMessages": 10000,
          "MessageExpiryInterval": 3600
        },
        "Redis": {
          "MaxRetries": 3,
          "RetryDelayMilliseconds": 100,
          "ConnectTimeout": 5000,
          "SyncTimeout": 5000,
          "AbortOnConnectFail": false,
          "KeepAlive": 60,
          "AllowAdmin": false,
          "Ssl": false,
          "ConnectRetry": 3
        },
        "Performance": {
          "MaxDegreeOfParallelism": 0,
          "EnableResponseCompression": true,
          "CompressionLevel": "Fastest"
        },
        "Logging": {
          "LogLevel": {
            "Default": "Information",
            "Microsoft": "Warning",
            "Microsoft.Hosting.Lifetime": "Information",
            "MQTTnet": "Information"
          },
          "Console": {
            "FormatterName": "json"
          }
        }
      },
      "AllowedHosts": "*"
    }

  logging.json: |
    {
      "Serilog": {
        "Using": ["Serilog.Sinks.Console"],
        "MinimumLevel": {
          "Default": "Information",
          "Override": {
            "Microsoft": "Warning",
            "System": "Warning"
          }
        },
        "WriteTo": [
          {
            "Name": "Console",
            "Args": {
              "formatter": "Serilog.Formatting.Compact.CompactJsonFormatter, Serilog.Formatting.Compact"
            }
          }
        ],
        "Enrich": ["FromLogContext", "WithMachineName", "WithThreadId"],
        "Properties": {
          "Application": "DeltaList-MQTT-Backend",
          "Environment": "Production"
        }
      }
    }
