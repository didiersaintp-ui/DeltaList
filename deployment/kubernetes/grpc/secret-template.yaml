# Secret template for gRPC Backend - DO NOT COMMIT WITH REAL VALUES
# Use envsubst or sed to replace placeholders before applying:
#   envsubst < secret-template.yaml | kubectl apply -f -
# Or use Azure Key Vault with CSI driver for production
---
apiVersion: v1
kind: Secret
metadata:
  name: deltalist-secrets
  namespace: deltalist
  labels:
    app: grpc-backend
    poc: poc-a
type: Opaque
stringData:
  # Redis connection string
  # Format: redis-host:port,password=xxx,ssl=false
  # Example: redis.deltalist.svc.cluster.local:6379,password=${REDIS_PASSWORD}
  redis-connection-string: "${REDIS_CONNECTION_STRING}"

  # Security secret key for JWT token signing (min 32 characters)
  # Generate with: openssl rand -base64 32
  security-secret-key: "${SECURITY_SECRET_KEY}"

  # Security salt for password hashing (min 16 characters)
  # Generate with: openssl rand -base64 24
  security-salt: "${SECURITY_SALT}"

  # JWT signing key (optional, if different from secret-key)
  jwt-signing-key: "${JWT_SIGNING_KEY}"

  # Encryption key for sensitive data at rest (AES-256, 32 bytes base64)
  # Generate with: openssl rand -base64 32
  encryption-key: "${ENCRYPTION_KEY}"

---
