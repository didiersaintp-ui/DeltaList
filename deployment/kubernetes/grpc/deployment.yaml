apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc-backend
  namespace: deltalist
  labels:
    app: grpc-backend
    poc: poc-a
spec:
  replicas: 3
  selector:
    matchLabels:
      app: grpc-backend
  template:
    metadata:
      labels:
        app: grpc-backend
        poc: poc-a
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: grpc-backend
        image: ${ACR_NAME}.azurecr.io/grpc-backend:${IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - name: grpc
          containerPort: 5001
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: Backend__Environment
          value: "Production"
        - name: Backend__Redis__ConnectionString
          valueFrom:
            secretKeyRef:
              name: deltalist-secrets
              key: redis-connection-string
        - name: Backend__Security__SecretKey
          valueFrom:
            secretKeyRef:
              name: deltalist-secrets
              key: security-secret-key
        - name: Backend__Security__Salt
          valueFrom:
            secretKeyRef:
              name: deltalist-secrets
              key: security-salt
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 9090
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      imagePullSecrets:
      - name: acr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: grpc-backend
  namespace: deltalist
  labels:
    app: grpc-backend
spec:
  type: LoadBalancer
  selector:
    app: grpc-backend
  ports:
  - name: grpc
    port: 5001
    targetPort: 5001
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours for long-lived connections
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: grpc-backend-hpa
  namespace: deltalist
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: grpc-backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
