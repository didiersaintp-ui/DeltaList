# Production resource patches - production-grade limits
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc-backend
spec:
  template:
    spec:
      containers:
      - name: grpc-backend
        resources:
          limits:
            cpu: 2000m
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt-backend
spec:
  template:
    spec:
      containers:
      - name: mqtt-backend
        resources:
          limits:
            cpu: 2000m
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  template:
    spec:
      containers:
      - name: redis
        resources:
          limits:
            cpu: 1000m
            memory: 2Gi
          requests:
            cpu: 250m
            memory: 512Mi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: emqx
spec:
  template:
    spec:
      containers:
      - name: emqx
        resources:
          limits:
            cpu: 4000m
            memory: 8Gi
          requests:
            cpu: 1000m
            memory: 2Gi
